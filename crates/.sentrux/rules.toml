# Sentrux architectural rules for Omnis. Layers mirror ARCHITECTURE.md §3: higher order depends on
# lower order only, and boundaries encode the graph rules stated there. Sentrux scans `crates/`,
# so paths are relative to that directory.

[constraints]
max_cycles = 0
max_cc = 25
max_fn_lines = 100
no_god_files = true

[[layers]]
name = "core"
paths = ["omnis-core/*"]
order = 0

[[layers]]
name = "expr"
paths = ["omnis-expr/*"]
order = 1

[[layers]]
name = "data"
paths = ["omnis-data/*"]
order = 2

[[layers]]
name = "leaves"
paths = ["omnis-rules/*", "omnis-gen/*", "omnis-eco/*", "omnis-story/*"]
order = 3

[[layers]]
name = "sim"
paths = ["omnis-sim/*"]
order = 4

[[layers]]
name = "cli"
paths = ["omnis-cli/*"]
order = 5

[[layers]]
name = "clients"
paths = ["omnis-app/*", "omnis-mcp/*"]
order = 6

# Leaves never import each other (story may read eco types only; enforce the rest).
[[boundaries]]
from = "omnis-rules/*"
to = "omnis-gen/*"
reason = "Leaf crates never import each other; cross-cutting flows go through omnis-sim"

[[boundaries]]
from = "omnis-rules/*"
to = "omnis-eco/*"
reason = "Leaf crates never import each other"

[[boundaries]]
from = "omnis-gen/*"
to = "omnis-eco/*"
reason = "Leaf crates never import each other"

[[boundaries]]
from = "omnis-eco/*"
to = "omnis-gen/*"
reason = "Leaf crates never import each other"

# omnis-app talks only to omnis-sim; it never reaches below it.
[[boundaries]]
from = "omnis-app/*"
to = "omnis-data/*"
reason = "The app receives loaded data through omnis-sim (ARCHITECTURE.md §3)"

[[boundaries]]
from = "omnis-app/*"
to = "omnis-core/*"
reason = "The app depends on omnis-sim only"

# The MCP bridge uses omnis-cli's library, never the simulation directly.
[[boundaries]]
from = "omnis-mcp/*"
to = "omnis-sim/*"
reason = "Headless runs go through omnis_cli::Headless so behaviour has one implementation"
