[package]
name = "omnis-app"
description = "Omnis game application: presentation, input, editor, dev socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "omnis"
path = "src/main.rs"

[features]
default = ["devtools", "feathers"]
# Dev socket and Dev commands (ARCHITECTURE.md §9). Release builds use --no-default-features.
devtools = ["dep:serde_json"]
# The Feathers experiment (PRD D26, ARCHITECTURE.md A11): Bevy's interface crates and Feathers,
# for one screen beside the canvas. Never in a release build.
feathers = ["devtools", "bevy/ui", "bevy/bevy_feathers"]
# Local iteration only, never shipped: dynamic linking and hot asset reload.
dev = ["bevy/dynamic_linking", "bevy/bevy_dev_tools", "bevy/file_watcher"]

[dependencies]
omnis-sim = { workspace = true }
# `2d` pulls in default_app (asset, log, state) and default_platform (winit, x11, wayland).
# The `3d` group is never enabled (ARCHITECTURE.md §8.1).
bevy = { workspace = true, features = ["2d", "png"] }
# Dev socket framing only (ARCHITECTURE.md §9.1, §13).
serde_json = { workspace = true, optional = true }
