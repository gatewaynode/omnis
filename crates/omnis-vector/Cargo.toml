[package]
name = "omnis-vector"
description = "Omnis 3D presentation experiment: vector-line exploration over the simulation's grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "omnis-vector"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
default = ["devtools"]
# The dev socket (ARCHITECTURE.md §9): the MCP bridge drives and captures the game through it.
# Release builds use --no-default-features.
devtools = ["dep:serde_json"]
# The world itself for the integration tests (`sim::SimWorld` derefs to it). Never in a build:
# the library is checked without it, so it reads the world only through views (ARCH A17).
test-fixtures = []

[dependencies]
omnis-sim = { workspace = true }
serde_json = { workspace = true, optional = true }
# `bevy_pbr` is the smallest addition that draws gizmos through a Camera3d; the full `3d` group
# (glTF, ktx2, zstd, LUTs) is not used (presentation-ARCHITECTURE.md §3, VA1). `ui` is for the HUD.
bevy = { workspace = true, features = ["2d", "png", "bevy_pbr", "ui"] }

[dev-dependencies]
omnis-vector = { path = ".", features = ["test-fixtures"] }
serde_json = { workspace = true }
