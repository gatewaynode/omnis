name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# macOS only for now (owner, 2026-09-12). When Linux returns, restore the OS matrix, the apt
# packages for winit/wayland, the fingerprint artifact upload, and the cross-platform compare job
# (ARCHITECTURE.md §11, test tier 3).
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - name: Simulation crate lint
        run: scripts/lint-sim.sh --self-test && scripts/lint-sim.sh
      - name: Dependency duplicates
        run: scripts/check-duplicates.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Golden replay through the CLI
        run: cargo run -p omnis-cli --locked -- replay crates/omnis-sim/tests/replays/walk.ron --pack packs/test
